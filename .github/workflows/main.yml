name: Build TESFMTX Firmware (ESP32-S3)

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Compile sketch for ESP32-S3
        uses: arduino/compile-sketches@v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          platforms: |
            - name: esp32:esp32
              source-url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
          fqbn: "esp32:esp32:esp32s3:JTAGAdapter=default,PSRAM=disabled,PartitionScheme=default,CPUFreq=240,FlashMode=qio,FlashFreq=80,FlashSize=4M,UploadSpeed=921600,DebugLevel=none"
          libraries: |
            - name: KT0803
          sketch-paths: |
            - ./TESFMTX
          cli-compile-flags: |
            - --export-binaries
            - --warnings=none

      - name: Locate boot_app0.bin (needed to merge a plug-and-play binary)
        run: |
          BOOT_APP0=$(find ~/.arduino15/packages/esp32 -name "boot_app0.bin" | head -n 1)
          echo "BOOT_APP0=$BOOT_APP0" >> "$GITHUB_ENV"
          echo "Found boot_app0.bin at: $BOOT_APP0"

      - name: Install esptool
        run: pip install esptool

      - name: Merge into a single plug-and-play flashable binary
        run: |
          cd TESFMTX/build/esp32.esp32.esp32s3
          ls -la
          esptool.py --chip esp32s3 merge_bin \
            -o ../../../TESFMTX-merged-flash.bin \
            --flash_mode qio --flash_freq 80m --flash_size 4MB \
            0x0     TESFMTX.ino.bootloader.bin \
            0x8000  TESFMTX.ino.partitions.bin \
            0xe000  "$BOOT_APP0" \
            0x10000 TESFMTX.ino.bin

      - name: Upload full build output (bootloader, partitions, app, elf, map)
        uses: actions/upload-artifact@v4
        with:
          name: TESFMTX-build-output
          path: TESFMTX/build/**

      - name: Upload single merged flashable binary
        uses: actions/upload-artifact@v4
        with:
          name: TESFMTX-merged-flash-bin
          path: TESFMTX-merged-flash.bin
