name: Build RootX v6.0 Fast

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # --- 1. INSTALL TOOLS UTAMA UBUNTU ---
      - name: Install System Prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y wget git flex bison gperf python3-pip python3-setuptools cmake ninja-build ccache libffi-dev libssl-dev dfu-util python3-venv

      # --- 2. CEK CACHE ESP-IDF DI GUDANG (Pake RESTORE) ---
      - name: Restore ESP-IDF Cache
        id: cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.0-${{ runner.os }}-v1

      # --- 3. DOWNLOAD & INSTALL (Hanya jalan kalau Cache Kosong) ---
      - name: Clone and Install ESP-IDF
        if: steps.cache-restore.outputs.cache-hit != 'true'
        run: |
          git clone -b v6.0 --depth 1 --recursive https://github.com/espressif/esp-idf.git ~/esp-idf
          ~/esp-idf/install.sh

      # --- 4. PAKSA SIMPAN CACHE SEKARANG JUGA! (Sebelum Compile) ---
      - name: Save ESP-IDF Cache
        if: steps.cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/esp-idf
            ~/.espressif
          key: esp-idf-v6.0-${{ runner.os }}-v1

      # --- 5. PATCHING SOURCE CODE & BUILD FIRMWARE ---
      - name: Patch gdbstub Source
        run: |
          python3 -c "import os,pathlib; p=pathlib.Path(os.path.expanduser('~/esp-idf'))/'components/esp_gdbstub/src/gdbstub.c'; s=p.read_text(encoding='utf-8'); s=s.replace('#if (CONFIG_ESP_SYSTEM_GDBSTUB_RUNTIME || CONFIG_ESP_GDBSTUB_SUPPORT_TASKS)', '#if 1'); p.write_text(s, encoding='utf-8')"

      - name: Ambil cert & buat header
        run: |
          mkdir -p main/include

          # Ambil FULL chain (leaf + intermediate) pake -showcerts,
          # bukan cuma leaf. Leaf doang gak bisa dipake ESP32 buat
          # verify server (leaf bukan CA), makanya kemarin mbedtls
          # error -0x2700 (X509_CERT_VERIFY_FAILED).
          echo | openssl s_client -connect atlantich2h.com:443 -servername atlantich2h.com -showcerts 2>/dev/null \
            | awk '/BEGIN CERTIFICATE/,/END CERTIFICATE/' > chain.pem

          # Ambil intermediate CA (WE1) langsung dari Google, ini yang
          # nandatangan cert atlantich2h.com. Ini bagian PALING PENTING:
          # tanpa ini, chain-nya putus dan verify tetep gagal walau kita
          # udah showcerts.
          curl -sL http://i.pki.goog/we1.crt -o we1.der
          openssl x509 -inform DER -in we1.der -outform PEM > we1.pem

          # Gabung: leaf (dari showcerts) + intermediate WE1.
          # Kalau showcerts kebetulan udah include WE1 juga, gak masalah,
          # dobel cert PEM tetep valid buat mbedtls.
          cat chain.pem we1.pem > cert.pem

          if [ ! -s cert.pem ]; then
            echo "❌ Gagal ambil sertifikat, cert.pem kosong"
            exit 1
          fi

          {
            echo '#pragma once'
            echo 'const char atlanticcert[] = '
            sed 's/^/"/; s/$/\\n"/' cert.pem
            echo ';'
          } > main/include/server_cert.h

          cat main/include/server_cert.h

      - name: Build Firmware
        run: |
          . ~/esp-idf/export.sh

          python3 -c "import os; p=os.path.expanduser('~/esp-idf/components/esp_wifi/src/wifi_init.c'); \
          f=open(p,'r').read() if os.path.exists(p) else ''; \
          open(p,'w').write(f.replace('return ESP_ERR_WIFI_IF;', 'return ESP_OK;')) if f else print('File not found')"

          echo "Patch Selesai, Lanjut Build..."

          if [ -f sdkconfig.defaults ]; then
            cp sdkconfig.defaults sdkconfig
          fi

          idf.py fullclean
          idf.py set-target esp32c3
          idf.py build

      # --- 6. UPLOAD HASIL JADI .BIN ---
      - name: Upload Bin
        uses: actions/upload-artifact@v4
        with:
          name: RootX-v6-Firmware
          path: |
            build/*.bin
            build/*/*.bin