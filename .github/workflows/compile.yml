name: Build ESP32-S3 NFC Firmware

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions di GitHub

jobs:
  build:
    name: Compile NFC Sketch
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ⚙️ Setup Arduino CLI
        uses: arduino/setup-arduino-cli@v2

      - name: 📦 Install ESP32 Core & Library Dependencies
        run: |
          # Update core index untuk ESP32 Espressif
          arduino-cli core update-index --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          # Install ESP32 core
          arduino-cli core install esp32:esp32 --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          
          # Install library resmi Adafruit untuk PN532 dan BusIO
          arduino-cli lib install "Adafruit PN532"
          arduino-cli lib install "Adafruit BusIO"

      - name: 🔨 Compile Sketch untuk ESP32-S3
        run: |
          # Ganti 'NfcWriter' di bawah ini dengan nama folder tempat file .ino kamu berada!
          arduino-cli compile --fqbn esp32:esp32:esp32s3 --output-dir ./build_output ./NfcWriter

      - name: 🚀 Upload Compiled Binary (.bin)
        uses: actions/upload-artifact@v4
        with:
          name: Firmware-NFC-Writer-ESP32S3
          path: ./build_output/*.bin
          retention-days: 7
